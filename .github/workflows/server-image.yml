name: Server image

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: server-image-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-24.04, windows-latest, macos-latest]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 15
        env:
            ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: '24.21.0'
            - run: npm ci
            - run: npm test
            - run: npm run typecheck
            - name: Lint affected code
              run: npx --no-install oxlint scripts/start-desktop.mjs scripts/desktop-runtime.mjs scripts/start-server.ts scripts/package-windows.mjs scripts/test-package.mjs scripts/test-docker.mjs public/migrate-appearance.js server/store.ts server/desktop.ts components/settings/AppSetup.tsx components/settings/SettingsModal.tsx components/header/LanguageSelector.tsx lib/desktop.ts lib/translations.ts tests/desktop-runtime.test.ts tests/desktop.test.ts
            - run: npm run build

    windows-desktop:
        needs: checks
        runs-on: windows-latest
        timeout-minutes: 45
        env:
            ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  persist-credentials: false
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
              with:
                  node-version: '24.21.0'
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
              with:
                  python-version: '3.13.15'
            - run: npm.cmd ci
            - run: npm.cmd run build
            - name: Package a candidate without changing the release version
              shell: pwsh
              run: |
                  $manifest = [IO.File]::ReadAllText('package.json')
                  try {
                      $candidate = $manifest | ConvertFrom-Json
                      $parts = $candidate.version.Split('.')
                      $candidate.version = $parts[0] + '.' + ([int]$parts[1] + 1) + '.0'
                      [IO.File]::WriteAllText('package.json', ($candidate | ConvertTo-Json -Depth 30))
                      $env:NEXTPLAY_BUILD_PYTHON = (Get-Command python).Source
                      npm.cmd run package:windows
                      if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
                  } finally { [IO.File]::WriteAllText('package.json', $manifest) }
            - name: Upgrade from the public browser installer
              shell: pwsh
              run: |
                  $previous = Join-Path $PWD 'work/downloads/NextPlay-Setup-0.9.1-x64.exe'
                  Invoke-WebRequest 'https://github.com/ivangonzalezsp/nextplay-releases/releases/download/v0.9.1/NextPlay-Setup-0.9.1-x64.exe' -OutFile $previous
                  if ((Get-FileHash $previous).Hash -ne 'cd7b2e7663a38374987dae92aef3f5bf559243b9e26e57585549190269dba2a8') { throw 'Previous installer checksum mismatch.' }
                  $candidate = (Get-ChildItem outputs/windows/NextPlay-Setup-*-x64.exe | Select-Object -First 1).FullName
                  powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-installer.ps1 -PreviousInstaller $previous -CandidateInstaller $candidate
                  if ($LASTEXITCODE -ne 0) { throw 'Upgrade test failed.' }
                  powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-installer.ps1 -SkipUpgrade -CandidateInstaller $candidate
                  if ($LASTEXITCODE -ne 0) { throw 'Fresh installation test failed.' }
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: nextplay-windows-candidate
                  path: outputs/windows/
                  retention-days: 14
                  if-no-files-found: error

    server:
        needs: checks
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-24.04
                      arch: amd64
                    - runner: ubuntu-24.04-arm
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: '24.21.0'
            - name: Build server image
              run: docker build --tag nextplay-server:latest .
            - name: Verify runtime and data preservation
              run: node scripts/test-docker.mjs nextplay-server:latest
            - name: Export image and source
              env:
                  IMAGE_ARCH: ${{ matrix.arch }}
              run: |
                  mkdir -p outputs/server
                  version=$(node -p "require('./package.json').version")
                  docker tag nextplay-server:latest "nextplay-server:$version"
                  docker save nextplay-server:latest "nextplay-server:$version" | gzip > "outputs/server/nextplay-server-$version-$IMAGE_ARCH.tar.gz"
                  git archive --format=tar.gz --output="outputs/server/nextplay-source-$version.tar.gz" HEAD
                  cp compose.yaml outputs/server/
                  cp docs/docker-server.md outputs/server/README.md
                  cd outputs/server
                  sha256sum *.tar.gz > SHA256SUMS.txt
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: nextplay-server-${{ matrix.arch }}
                  path: outputs/server/
                  if-no-files-found: error
                  retention-days: 30

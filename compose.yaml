services:
    nextplay:
        image: nextplay-server:latest
        pull_policy: never
        init: true
        restart: unless-stopped
        ports:
            - '${NEXTPLAY_BIND_IP:-127.0.0.1}:${NEXTPLAY_HTTP_PORT:-3000}:3000'
        volumes:
            - nextplay-data:/var/lib/nextplay

volumes:
    nextplay-data:
